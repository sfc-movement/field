<body>

  <header class="hero" style="--band:#38824f">
    <nav class="crumb" aria-label="상위 페이지"><a href="../">영역운동</a><span aria-hidden="true">›</span><span>환경영역</span></nav>

  </header>
  <main>
  <section class="section">
    <div class="section-head"><h2>다가오는 모임</h2></div>
    <div class="empty reveal"><b>다음 모임 소식을 준비하고 있어요</b>홍보물이 올라오면 이곳에 먼저 보여요.</div>
  </section>
  <section class="section">
    <div class="section-head"><h2>지나온 기록</h2></div>
    <div class="feed">
    <a class="post reveal" href="../environment/2026-11-bookclub/" style="--c:var(--c-environment)">
      <img class="post-thumb" src="../assets/img/bookclub-cover.jpg" alt="" loading="lazy">
      <span>
        <span class="post-meta"><span class="chip">환경영역</span><span class="chip kind">스케치</span><span>2026년 11월</span></span>

    <p>의료 · 통일 · 환경 · 공학</p>
  </footer>
<script>
{
  const els = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 });
    els.forEach(el => io.observe(el));
  } else { els.forEach(el => el.classList.add('in')); }
}
</script>
