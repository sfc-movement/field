name: 📸 모임 스케치 올리기
description: 이미 한 모임의 기록을 카드형 페이지로 올립니다.
title: "[스케치] "
labels: ["스케치"]
body:
  - type: markdown
    attributes:
      value: |
        모임을 마친 뒤 기록을 남겨 주세요. **간사님이 승인하면** 몇 분 안에 영역운동 홈페이지에 올라가요.
        사진은 각 칸에 **끌어다 놓거나 붙여 넣으면** 됩니다. (휴대폰은 칸 아래 사진 버튼)
        ⚠️ 공개 웹페이지에 올라가요. 전화번호 같은 개인정보, 본인 동의 없는 얼굴 사진은 넣지 말아 주세요.
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options: ["통일영역", "공학영역", "의료영역", "환경영역"]
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: 제목
      placeholder: "예: 12월 책모임 — 『○○○』"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 모임 날짜
      description: 연-월-일 형식으로 적어 주세요. 여러 번 모였다면 마지막 날짜.
      placeholder: "2026-12-03"
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: 한 줄 요약
      description: 목록과 링크 미리보기에 보이는 문장이에요.
      placeholder: "예: 네 번의 모임으로 ○○을 함께 읽은 기록입니다."
    validations:
      required: true
  - type: textarea
    id: cover
    attributes:
      label: 대표 사진
      description: 맨 위에 크게 보일 사진 1장 (선택)
  - type: textarea
    id: cards
    attributes:
      label: 내용 카드
      description: |
        `## 카드 제목` 으로 시작하는 줄마다 새 카드가 만들어져요. 그 아래에 내용을 적어 주세요.
        빈 줄 = 문단 나누기 · `- ` = 목록 · `> ` = 인용 · `**굵게**` · 사진은 카드 안 원하는 자리에 붙여 넣기
      placeholder: |
        ## 창조 세계는 우리의 이해를 넘어선다
        하나님은 어떤 것도 똑같은 방식으로 지으시지 않으셨습니다.

        > 책 속 인상 깊은 문장을 이렇게 적어요. (p.27)

        ## 우리가 할 수 있는 일
        - 자가용 자제
        - 텃밭 가꾸기
    validations:
      required: true
  - type: textarea
    id: photos
    attributes:
      label: 모임 사진
      description: 맨 아래 사진 모음에 들어갈 사진들 (선택)
  - type: textarea
    id: share
    attributes:
      label: 나눔 질문
      description: 한 줄에 질문 하나씩 (선택)
  - type: textarea
    id: prayer
    attributes:
      label: 기도제목
      description: 한 줄에 기도제목 하나씩 (선택)
