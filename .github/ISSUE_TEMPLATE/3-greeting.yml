name: ✏️ 영역 소개·영역장 인사 바꾸기
description: 영역 방 맨 위의 한 줄 소개와 '영역장 인사' 글을 바꿉니다.
title: "[인사 수정] "
labels: ["인사 수정"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options: ["통일영역", "공학영역", "의료영역", "환경영역"]
    validations:
      required: true
  - type: input
    id: lead
    attributes:
      label: 한 줄 소개
      description: 바꾸지 않으려면 비워 두세요.
  - type: textarea
    id: greeting
    attributes:
      label: 영역장 인사
      description: 문단은 빈 줄로 나눠 주세요. 바꾸지 않으려면 비워 두세요.
